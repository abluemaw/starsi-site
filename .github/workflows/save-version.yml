name: Save this version
# A button: Actions tab > "Save this version" > Run workflow. Gives the current live site a plain-word name you can restore later.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Short name, lowercase letters, numbers and dashes (like hero-stars-ok)"
        required: true

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Save it
        env:
          NAME: ${{ inputs.name }}
        run: |
          set -e
          if ! echo "$NAME" | grep -Eq '^[a-z0-9][a-z0-9-]{0,60}$'; then
            echo "Use only lowercase letters, numbers and dashes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "saved-$NAME"
          git push origin "saved-$NAME"
          echo "Saved as saved-$NAME"
