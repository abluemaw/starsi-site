# Any pull request opened against main (for example by ChatGPT/Codex) is merged
# right away with no review, and the live site is rebuilt.
name: Auto-merge pull requests
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: write
  actions: write
  pull-requests: write
  pages: write
jobs:
  merge:
    # Only PRs from branches inside this repo (people with Write access), never forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch --repo "${{ github.repository }}"
      - name: Check out the merged site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync the design and rebuild index.html
        run: |
          python3 tools/design_sync.py auto HEAD~1
          python3 build.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sync design and rebuild index.html"
            git push origin HEAD:main
          fi
      - name: Rebuild the live site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Add a picture to the version history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run snapshot.yml --repo "${{ github.repository }}" -f commits="$(git rev-parse HEAD)" || true
