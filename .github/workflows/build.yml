name: Build the page
# Keeps index.html in step with the files in sections/ whenever someone saves a change straight to main.
# (Pull requests get the same build inside the auto-merge workflow.)
on:
  push:
    branches: [main]
    paths:
      - "sections/**"
      - "build.py"

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 build.py
          if git diff --quiet index.html; then
            echo "index.html is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html from sections"
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
