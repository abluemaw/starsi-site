name: Build the page
# Keeps index.html in step with the files in sections/ whenever someone saves a change straight to main.
# (Pull requests get the same build inside the auto-merge workflow.)
on:
  push:
    branches: [main]
    paths:
      - "sections/**"
      - "build.py"
      - "DESIGN.md"
      - "designs/**"
      - "tools/design_sync.py"
      - "design/template.html"
      - "images/**"

permissions:
  contents: write
  actions: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync the design and rebuild index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 tools/design_sync.py auto "${BEFORE:-HEAD~1}"
          python3 build.py
          if [ -z "$(git status --porcelain)" ]; then
            echo "Everything is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync design and rebuild index.html"
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Add a picture to the version history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run snapshot.yml --repo "${{ github.repository }}" -f commits="$(git rev-parse HEAD)" || true
