<!-- SECTION: WHAT COULD SUCCESS LOOK LIKE (three school sizes x three languages, each with a video box and a picture) -->
<section class="alt" id="success" aria-labelledby="success-title" lang="en" data-lang="en">
  <div class="wrap">
    <div class="success-head">
      <h2 id="success-title" data-i18n="title">What could success look like?</h2>
    </div>

    <div class="success-tabs" role="tablist" aria-label="School size">
      <button type="button" role="tab" class="success-tab is-on" id="tab-small" data-size="small" aria-selected="true" aria-controls="panel-small" data-i18n="small">Small school</button>
      <button type="button" role="tab" class="success-tab" id="tab-mid" data-size="mid" aria-selected="false" aria-controls="panel-mid" tabindex="-1" data-i18n="mid">Midsize school</button>
      <button type="button" role="tab" class="success-tab" id="tab-big" data-size="big" aria-selected="false" aria-controls="panel-big" tabindex="-1" data-i18n="big">Big school</button>
    </div>

    <div class="success-panel" role="tabpanel" id="panel-small" aria-labelledby="tab-small" data-size="small">
      <div class="success-video" data-size="small"></div>
      <figure class="success-photo"><img src="images/success-small.webp" alt="" data-i18n-alt="alt-small" width="1344" height="768" loading="lazy"></figure>
    </div>
    <div class="success-panel" role="tabpanel" id="panel-mid" aria-labelledby="tab-mid" data-size="mid" hidden>
      <div class="success-video" data-size="mid"></div>
      <figure class="success-photo"><img src="images/success-mid.webp" alt="" data-i18n-alt="alt-mid" width="1344" height="768" loading="lazy"></figure>
    </div>
    <div class="success-panel" role="tabpanel" id="panel-big" aria-labelledby="tab-big" data-size="big" hidden>
      <div class="success-video" data-size="big"></div>
      <figure class="success-photo"><img src="images/success-big.webp" alt="" data-i18n-alt="alt-big" width="1344" height="768" loading="lazy"></figure>
    </div>
  </div>
</section>
