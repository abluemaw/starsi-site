<script>try{var r=document.documentElement,t=localStorage.getItem("starsi-theme");r.setAttribute("data-theme",t||"dark");var q=new URLSearchParams(location.search).get("design");if(q!==null){if(q&&q!=="live")localStorage.setItem("starsi-look",q);else localStorage.removeItem("starsi-look")}var l=localStorage.getItem("starsi-look");if(l&&/^[a-z0-9_-]+$/i.test(l)){r.setAttribute("data-look",l);var k=document.createElement("link");k.rel="stylesheet";k.id="look-css";k.href="designs/looks/"+l+".css";document.head.appendChild(k)}}catch(e){}</script>
