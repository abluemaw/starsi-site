<!-- HEADER (shared on all pages) -->
<header>
  <div class="wrap nav">
    <a class="brand" href="#top" aria-label="StarSI AI home"><img class="nav-logo logo-dark" src="images/starsi-navbar-star-logo.webp" alt="StarSI AI" width="650" height="219">
      <img class="nav-logo logo-light" src="" alt="" hidden></a>
    <nav class="links">
      <a class="plain" href="#welcome">Welcome</a>
      <a class="plain" href="#sales">Home</a>
      <a class="plain" href="#features">Features</a>
      <a class="plain" href="#benefits">Benefits</a>
      <a class="plain" href="#pricing">Pricing</a>
      <a class="plain" href="#stories">Success Stories</a>
      <details class="lang-menu">

          <a role="menuitem" href="{{ROOT}}"{{CUR_EN}} hreflang="en" lang="en"><img src="images/flags/us.svg" alt="" width="22" height="15">English</a>

      <select class="look-picker" id="look-picker" aria-label="Choose a look" hidden></select>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark mode"></button>
      <a class="btn small" href="#enroll">Enroll Now</a>
